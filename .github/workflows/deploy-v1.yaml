name: Deploy v1

# v1 is frozen and static (no API, no Supabase): it lives in v1/ and is served by
# Cloudflare Pages at v1.jianlee.me. Runs only when something under v1/ changes.
# --branch=v1 publishes to the Pages project's production branch.

on:
  push:
    branches:
      - main
    paths:
      - v1/**
      - .github/workflows/deploy-v1.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v1
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=v1
